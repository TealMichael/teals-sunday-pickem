name: Pickem NFL Refresh

on:
  schedule:
    # Tuesday-Thursday: routine injury/status maintenance every ~6 hours.
    - cron: "7 1,7,13,19 * * 2-4"
      timezone: "America/New_York"
    # Tuesday noon: redundant publication window. GitHub scheduled jobs can be
    # delayed, so retry every 10 minutes through 12:57. Auto mode is idempotent:
    # once the pool is published, later retries simply see no publication due.
    - cron: "7,17,27,37,47,57 12 * * 2"
      timezone: "America/New_York"
    # Friday: injury/status maintenance every ~4 hours.
    - cron: "7 1,5,9,13,17,21 * * 5"
      timezone: "America/New_York"
    # Saturday: injury/status maintenance every ~3 hours.
    - cron: "7 1,4,7,10,13,16,19,22 * * 6"
      timezone: "America/New_York"
    # Sunday morning: hourly checks before the final two-hour window.
    - cron: "7 8-10 * * 0"
      timezone: "America/New_York"
    # Sunday 11 AM-midnight: every 15 minutes for injuries, then live scoring after lock.
    # The :07/:22/:37/:52 offsets avoid GitHub's top-of-hour congestion.
    - cron: "7,22,37,52 11-23 * * 0"
      timezone: "America/New_York"
    # Long SNF/overtime buffer after midnight Monday.
    - cron: "7,22,37,52 0-1 * * 1"
      timezone: "America/New_York"
    # Monday final reconciliation: retry hourly if official data is not settled at 9 AM.
    - cron: "7 9-13 * * 1"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh mode"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - diagnostic
          - preseason_replay
          - schedule
          - injury
          - live
          - final
          - publish
      week:
        description: "NFL week (0 = current)"
        required: false
        default: "0"
      force:
        description: "Force an early publish (manual test/admin only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pickem-nfl-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements-backend.txt

      - name: Refresh NFL data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          WEEK="${{ github.event.inputs.week || '0' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          EXTRA=""
          if [ "$FORCE" = "true" ]; then EXTRA="--force"; fi
          python scripts/nfl_refresh.py --mode "$MODE" --week "$WEEK" $EXTRA
